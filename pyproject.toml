[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-reservation-bot"
version = "0.1.0"
description = "GitHub Actions bot to book/clear a preferred desk in SharePoint Master Bookings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.2",
  "msal>=1.28.0",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["desk_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
